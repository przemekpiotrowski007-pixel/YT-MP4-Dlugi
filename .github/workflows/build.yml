<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube → MP4 720p</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;max-width:720px;margin:60px auto;padding:20px}
.card{background:#1b1b1b;padding:24px;border-radius:18px}
input,button{font-size:17px;padding:14px;border-radius:10px;border:0}
input{width:65%;min-width:220px}
button{font-weight:700;cursor:pointer}
#s{margin-top:18px;white-space:pre-wrap}
a{color:#fff}
</style>
</head>
<body>
<div class="card">
<h1>YouTube → MP4 720p</h1>
<p>Wklej link do filmu i kliknij pobieranie.</p>
<input id="u" placeholder="https://www.youtube.com/watch?v=...">
<button id="b">Pobierz MP4 720p</button>
<div id="s"></div>
</div>
<script>
const API='https://mp4-cobalt-api3.onrender.com/';
b.onclick=async()=>{
  const url=u.value.trim();
  if(!url){s.textContent='Wklej link do filmu.';return}
  b.disabled=true;s.textContent='Przygotowuję plik...';
  try{
    const r=await fetch(API,{
      method:'POST',
      headers:{'Accept':'application/json','Content-Type':'application/json'},
      body:JSON.stringify({
        url,
        videoQuality:'720',
        downloadMode:'auto',
        youtubeVideoCodec:'h264',
        youtubeVideoContainer:'mp4',
        filenameStyle:'pretty'
      })
    });
    const j=await r.json();
    if(j.status==='tunnel'||j.status==='redirect'){
      s.innerHTML='Gotowe. <a href="'+j.url+'">Kliknij tutaj, jeśli pobieranie nie ruszy samo.</a>';
      location.href=j.url;
    }else if(j.status==='picker'){
      s.innerHTML='';
      (j.picker||[]).forEach((x,i)=>{
        const a=document.createElement('a');
        a.href=x.url;a.textContent='Pobierz plik '+(i+1);a.target='_blank';
        s.appendChild(a);s.appendChild(document.createElement('br'));
      });
    }else if(j.status==='error'){
      throw new Error(j.error?.code||'Błąd API');
    }else{
      throw new Error('Nieobsługiwana odpowiedź: '+j.status);
    }
  }catch(e){
    s.textContent='Błąd: '+(e.message||e);
  }finally{
    b.disabled=false;
  }
};
</script>
</body>
