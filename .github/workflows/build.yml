      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            'org.gradle.workers.max=2' \
            'org.gradle.parallel=false' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' > gradle.properties
          gradle --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/YT-MP4-Dlugi.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-MP4-Dlugi-APK
          path: YT-MP4-Dlugi.apk
