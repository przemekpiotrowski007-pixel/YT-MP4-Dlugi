name: Build YT MP4 Dlugi v3 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p appsrc
          unzip -q YT-MP4-Dlugi-v3-project.zip -d appsrc
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/appsrc" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            'org.gradle.workers.max=2' \
            'org.gradle.parallel=false' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' > gradle.properties
          gradle --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/YT-MP4-Dlugi-v3.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-MP4-Dlugi-v3-APK
          path: YT-MP4-Dlugi-v3.apk
